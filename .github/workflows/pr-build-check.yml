name: SmartUI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.environment }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - Heltec_t096_companion_radio_ble_femon
          - Heltec_t114_companion_radio_ble
          - ProMicro_ra62_companion_radio_ble

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up build environment
        uses: ./.github/actions/setup-build-environment

      - name: Build firmware
        run: pio run -e "${{ matrix.environment }}"

      - name: Validate UF2 generation
        run: pio run -e "${{ matrix.environment }}" -t create_uf2

  qa:
    name: Static and framebuffer QA
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install QA dependencies
        run: python -m pip install --requirement requirements-qa.txt

      - name: Audit the three-board UI contract
        run: python tools/audit_exp45_ui_contract.py

      - name: Run exact framebuffer simulation
        run: python tools/simulate_exp45_ui_qa.py
